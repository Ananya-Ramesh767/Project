server:
  # Render (and most PaaS hosts) inject PORT at runtime and require the app to
  # bind to it; 8080 remains the local-dev default.
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: odysseus-backend
  
  datasource:
    # Default to persistent file-based H2 (PostgreSQL compatibility mode) in ./data/odysseus_db
    # with AUTO_SERVER=TRUE for concurrent console/process access,
    # or override with PostgreSQL env vars (e.g. on Render / production)
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/odysseus_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  # Default is a dev-only placeholder long enough for HS256 (needs >= 256 bits) so a
  # fresh clone boots without a WeakKeyException; override JWT_SECRET in real deployments.
  secret: ${JWT_SECRET:OdysseusSuperSecretSigningKeyForJWTAuthentication2026SecureKeyWithMinimum256Bits}
  expiration-ms: 86400000 # 24 hours
